[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "starye-quant-akshare-bridge"
version = "0.1.0"
description = "Independent AkShare evidence bridge for the Starye Quant workbench"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_akshare_bridge = ["py.typed"]
