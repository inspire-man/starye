schema: spec-driven

context: |
  项目：Starye 个人内容中台。
  技术栈：TypeScript、Cloudflare Workers/Pages、Hono、Vue 3/Nuxt、D1/R2/KV、Drizzle、Better Auth、pnpm/Turborepo。
  约束：Worker 使用 Web API；本地浏览器验证走 http://localhost:8080；crawler/D1 改动需要 authoritative readback；中文文档优先。

rules:
  proposal:
    - 使用中文，包含背景、目标、非目标、影响和风险。
    - 至少写一条可验证的 MUST/SHALL 需求。
  spec:
    - 使用中文，写清需求、接口/组件、状态、边界和验收条件。
    - 核心需求使用 MUST/SHALL，便于检索。
  tasks:
    - 拆成可独立验证的小任务，通常每项 0.5-2 小时。
    - 每项包含完成标准。
  change:
    - 使用 kebab-case；推荐命名为 YYYY-MM-DD-<feature>。
    - 简述涉及的 app/package 与主要风险。
