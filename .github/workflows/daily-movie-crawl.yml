name: Daily Movie Crawl

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: Control-plane crawler run ID
        required: true
        type: string
      attempt:
        description: Control-plane attempt number
        required: true
        type: string
      template:
        description: Closed crawler template key
        required: true
        type: choice
        options: [movie]
      target:
        description: Selected tracked deployment target
        required: true
        type: string
      registration_probe:
        description: Run the scheduled registration path during a manual smoke test
        required: false
        default: false
        type: boolean

jobs:
  register-schedule:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.registration_probe == true) }}
    runs-on: ubuntu-latest
    environment: starye-org
    outputs:
      run_id: ${{ steps.register.outputs.run_id }}
      attempt: ${{ steps.register.outputs.attempt }}
    env:
      ACTIONS_CALLBACK_API_BASE_URL: ${{ secrets.ACTIONS_CALLBACK_API_BASE_URL }}
      ACTIONS_PROVIDER_ENVIRONMENT: starye-org
      ACTIONS_PROVIDER_REF: main
      ACTIONS_PROVIDER_REPOSITORY: inspire-man/starye
      ACTIONS_PROVIDER_TARGET: starye-org
      ACTIONS_PROVIDER_TEMPLATE: movie
      ACTIONS_PROVIDER_WORKFLOW: .github/workflows/daily-movie-crawl.yml
      ACTIONS_SCHEDULE_BUCKET: ''
      ACTIONS_SCHEDULED_AT: ''
      TASK_RUNNER_CALLBACK_KEY_ID_CURRENT: ${{ secrets.TASK_RUNNER_CALLBACK_KEY_ID_CURRENT }}
      TASK_RUNNER_CALLBACK_SECRET_CURRENT: ${{ secrets.TASK_RUNNER_CALLBACK_SECRET_CURRENT }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v6.3.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: register
        shell: bash
        run: |
          set -euo pipefail
          scheduled_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          schedule_bucket="${scheduled_at:0:13}:00Z"
          ACTIONS_SCHEDULED_AT="$scheduled_at" ACTIONS_SCHEDULE_BUCKET="$schedule_bucket" \
            pnpm exec tsx packages/crawler/src/task-runner/actions-event-client.ts schedule-register

  resolve-target:
    needs: register-schedule
    if: ${{ needs.register-schedule.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.registration_probe != true) }}
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      attempt: ${{ steps.resolve.outputs.attempt }}
      template: ${{ steps.resolve.outputs.template }}
    env:
      STARYE_TARGET_ID: starye-org
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v6.3.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: resolve
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.target || '' }}
          INPUT_RUN_ID: ${{ inputs.run_id || '' }}
          INPUT_ATTEMPT: ${{ inputs.attempt || '' }}
          INPUT_TEMPLATE: ${{ inputs.template || '' }}
          INPUT_REGISTRATION_PROBE: ${{ inputs.registration_probe || false }}
          REGISTER_RUN_ID: ${{ needs.register-schedule.outputs.run_id || '' }}
          REGISTER_ATTEMPT: ${{ needs.register-schedule.outputs.attempt || '' }}
        run: |
          set -euo pipefail
          target="${INPUT_TARGET:-$STARYE_TARGET_ID}"
          if [ "$INPUT_REGISTRATION_PROBE" = true ]; then
            run_id="$REGISTER_RUN_ID"
            attempt="$REGISTER_ATTEMPT"
          else
            run_id="${INPUT_RUN_ID:-$REGISTER_RUN_ID}"
            attempt="${INPUT_ATTEMPT:-$REGISTER_ATTEMPT}"
          fi
          template="${INPUT_TEMPLATE:-movie}"
          test "$target" = starye-org
          test -n "$run_id"
          test "$attempt" -ge 1
          test "$template" = movie
          output="$(pnpm target-profile validate --target "$target")"
          github_environment="$(printf '%s\n' "$output" | sed -n 's/^CI GitHub environment: //p')"
          test "$github_environment" = starye-org
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "github_environment=$github_environment" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "template=$template" >> "$GITHUB_OUTPUT"

  crawl:
    needs: resolve-target
    if: ${{ always() && needs.resolve-target.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-target.outputs.github_environment }}
    env:
      ACTIONS_CALLBACK_API_BASE_URL: ${{ secrets.ACTIONS_CALLBACK_API_BASE_URL }}
      ACTIONS_APPLICATION_RUN_ID: ${{ needs.resolve-target.outputs.run_id }}
      ACTIONS_APPLICATION_ATTEMPT: ${{ needs.resolve-target.outputs.attempt }}
      ACTIONS_PROVIDER_ENVIRONMENT: ${{ needs.resolve-target.outputs.github_environment }}
      ACTIONS_PROVIDER_REF: main
      ACTIONS_PROVIDER_REPOSITORY: inspire-man/starye
      ACTIONS_PROVIDER_TARGET: ${{ needs.resolve-target.outputs.target }}
      ACTIONS_PROVIDER_TEMPLATE: ${{ needs.resolve-target.outputs.template }}
      ACTIONS_PROVIDER_WORKFLOW: .github/workflows/daily-movie-crawl.yml
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CRAWLER_SECRET: ${{ secrets.CRAWLER_SECRET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TASK_RUNNER_CALLBACK_KEY_ID_CURRENT: ${{ secrets.TASK_RUNNER_CALLBACK_KEY_ID_CURRENT }}
      TASK_RUNNER_CALLBACK_SECRET_CURRENT: ${{ secrets.TASK_RUNNER_CALLBACK_SECRET_CURRENT }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v6.3.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for crawler
        run: pnpm --filter @starye/crawler exec puppeteer browsers install chrome
      - name: Validate manual dispatch binding
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec tsx packages/crawler/src/task-runner/actions-event-client.ts validate-dispatch
      - id: prepare
        run: pnpm target-profile prepare-mutation --scope ci --target "${{ needs.resolve-target.outputs.target }}" --ci-environment "${{ needs.resolve-target.outputs.github_environment }}" --command crawler-optimized --run-id "${{ needs.resolve-target.outputs.run_id }}" --github-output "$GITHUB_OUTPUT"
      - name: Run selected movie entry
        run: pnpm target-profile run-prepared-entry --entry crawler-optimized --prepared-context "${{ steps.prepare.outputs.prepared_context_path }}"
      - name: Remove generated target files
        if: always()
        run: rm -f "${{ steps.prepare.outputs.api_config_path }}" "${{ steps.prepare.outputs.gateway_config_path }}" "${{ steps.prepare.outputs.prepared_context_path }}"
